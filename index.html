<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EVOLIX — System Under Maintenance</title>
  
  <!-- Font -->
  <link href="https://db.onlinewebfonts.com/c/e66905e07608167a84e6ad52f638c3c6?family=Helvetica+Now+Var" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          screens: {
            'xs': '475px',
          }
        }
      }
    }
  </script>

  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .four-oh-four {
      text-shadow: 0 0 80px rgba(255,255,255,0.3), 0 0 160px rgba(255,255,255,0.1);
    }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-black text-white antialiased overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // SVG Icons
    const ArrowRight = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M5 12h14" />
        <path d="m12 5 7 7-7 7" />
      </svg>
    );

    const Facebook = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" />
      </svg>
    );

    const Twitter = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z" />
      </svg>
    );

    const Dribbble = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10" />
        <path d="M19.13 5.09C15.22 9.14 10 10.44 2.25 10.94" />
        <path d="M21.75 12.84c-6.62-1.41-12.14 1-16.38 6.32" />
        <path d="M8.56 2.75c4.37 6 6 9.42 8 17.72" />
      </svg>
    );

    const Youtube = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.56 49.56 0 0 1-16.2 0A2 2 0 0 1 2.5 17" />
        <polygon points="10 15 15 12 10 9 10 15" />
      </svg>
    );

    const Linkedin = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" />
        <rect width="4" height="12" x="2" y="9" />
        <circle cx="4" cy="4" r="2" />
      </svg>
    );

    const Instagram = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect width="20" height="20" x="2" y="2" rx="5" ry="5" />
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
        <line x1="17.5" x2="17.51" y1="6.5" y2="6.5" />
      </svg>
    );

    // EVOLIX Official Geometric 'E' Logo (Matching actual logo image)
    const LogoIcon = ({ className = "w-8 h-8" }) => (
      <svg viewBox="0 0 400 400" className={className} xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="evolixGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#E59B34"/>
            <stop offset="100%" stopColor="#C47F22"/>
          </linearGradient>
        </defs>
        {/* Left Dark Bar */}
        <path 
          d="M 95 125 C 95 105, 110 95, 137 95 L 137 295 C 110 295, 95 285, 95 265 Z" 
          fill="#2D2D2D" 
          stroke="#444444"
          strokeWidth="2"
        />
        {/* Top Arm */}
        <path 
          d="M 137 95 L 223 45 L 265 70 L 137 145 Z" 
          fill="url(#evolixGoldGrad)" 
        />
        {/* Middle Arm */}
        <path 
          d="M 137 175 L 314 105 L 314 158 L 137 235 Z" 
          fill="url(#evolixGoldGrad)" 
        />
        {/* Bottom Arm */}
        <path 
          d="M 137 245 L 223 295 L 314 245 L 314 298 L 223 348 L 137 295 Z" 
          fill="url(#evolixGoldGrad)" 
        />
      </svg>
    );

    function App() {
      return (
        <div 
          className="relative min-h-screen flex flex-col bg-black text-white overflow-hidden"
          style={{ fontFamily: '"Helvetica Now Var", Helvetica, Arial, sans-serif' }}
        >
          {/* BACKGROUND VIDEO */}
          <video 
            autoPlay 
            muted 
            loop 
            playsInline 
            className="absolute inset-0 w-full h-full object-cover z-0"
          >
            <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260613_180732_a54afbf6-b30d-470e-861f-669871f09f67.mp4" type="video/mp4" />
          </video>

          {/* CONTENT WRAPPER */}
          <div className="relative z-10 flex flex-col min-h-screen justify-between">
            
            {/* NAVIGATION BAR */}
            <nav className="flex items-center justify-between px-6 md:px-12 lg:px-16 py-5">
              {/* Logo */}
              <a href="#" className="flex items-center gap-3">
                <LogoIcon className="w-8 h-8" />
                <span className="text-white text-xl font-bold tracking-wider">EVOLIX</span>
              </a>

              {/* Login Button */}
              <div className="flex items-center">
                <a 
                  href="#" 
                  className="bg-gradient-to-r from-emerald-400 to-cyan-500 text-white text-sm font-semibold px-6 py-2.5 rounded-full flex items-center gap-2 hover:brightness-110 transition-all"
                >
                  LOG IN
                  <ArrowRight className="w-4 h-4" />
                </a>
              </div>
            </nav>

            {/* HERO / MAINTENANCE SECTION */}
            <main className="flex-1 flex flex-col items-center justify-center text-center px-4 sm:px-6 py-12 sm:py-16 md:py-0">
              {/* Status Badge */}
              <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-semibold tracking-wider uppercase mb-6 sm:mb-8 backdrop-blur-md">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                System Upgrade In Progress
              </div>

              <h1 className="text-white/80 text-lg xs:text-2xl sm:text-3xl md:text-5xl font-light leading-snug tracking-tight mb-1 sm:mb-2">
                We're upgrading our systems
              </h1>
              <h1 className="text-white/80 text-lg xs:text-2xl sm:text-3xl md:text-5xl font-light leading-snug tracking-tight mb-8 sm:mb-12">
                This site is currently under maintenance
              </h1>

              {/* Giant Maintenance Text */}
              <div className="relative mb-8 sm:mb-12 w-full flex justify-center overflow-visible">
                <span className="text-[32px] xs:text-[48px] sm:text-[72px] md:text-[100px] lg:text-[130px] font-black text-white leading-none tracking-tighter select-none four-oh-four uppercase whitespace-nowrap">
                  MAINTENANCE
                </span>
              </div>

              {/* Action Button */}
              <a 
                href="#" 
                className="liquid-glass text-white text-[10px] xs:text-xs sm:text-sm tracking-[0.15em] sm:tracking-[0.2em] font-medium px-6 sm:px-8 py-3 sm:py-3.5 rounded-full uppercase inline-block hover:brightness-125 transition-all"
              >
                Back Online Soon
              </a>
            </main>

            {/* FOOTER */}
            <footer className="relative z-10 px-6 md:px-12 lg:px-16 pb-8 sm:pb-10 pt-10 sm:pt-16 border-t border-white/10">
              <div className="flex flex-col md:flex-row items-center justify-between gap-8 max-w-6xl mx-auto">
                
                {/* Newsletter Section */}
                <div className="w-full md:w-auto max-w-sm">
                  <h3 className="text-white text-[10px] sm:text-xs font-bold tracking-[0.15em] mb-3">
                    JOIN FOR EXCLUSIVE DEALS
                  </h3>
                  <form onSubmit={e => e.preventDefault()} className="flex flex-row">
                    <input 
                      type="email" 
                      placeholder="Type your email to sign up" 
                      className="bg-white text-gray-900 px-4 py-2.5 rounded-l-md text-xs placeholder:text-gray-400 focus:outline-none w-full"
                    />
                    <button 
                      type="submit" 
                      className="bg-gradient-to-r from-emerald-400 to-cyan-500 text-white px-5 py-2.5 rounded-r-md text-xs font-bold tracking-wider hover:brightness-110 transition-all whitespace-nowrap"
                    >
                      SEND IT
                    </button>
                  </form>
                </div>

                {/* Social Links & Copyright */}
                <div className="flex flex-col items-center md:items-end gap-4">
                  <div className="flex items-center gap-3">
                    <span className="text-white/50 text-xs font-bold tracking-widest mr-1">CONNECT</span>
                    <a href="#" className="text-white/50 hover:text-white transition-colors" aria-label="Facebook"><Facebook className="w-4 h-4" /></a>
                    <a href="#" className="text-white/50 hover:text-white transition-colors" aria-label="Twitter"><Twitter className="w-4 h-4" /></a>
                    <a href="#" className="text-white/50 hover:text-white transition-colors" aria-label="Dribbble"><Dribbble className="w-4 h-4" /></a>
                    <a href="#" className="text-white/50 hover:text-white transition-colors" aria-label="Youtube"><Youtube className="w-4 h-4" /></a>
                    <a href="#" className="text-white/50 hover:text-white transition-colors" aria-label="Linkedin"><Linkedin className="w-4 h-4" /></a>
                    <a href="#" className="text-white/50 hover:text-white transition-colors" aria-label="Instagram"><Instagram className="w-4 h-4" /></a>
                  </div>
                  <p className="text-white/40 text-xs tracking-wider">
                    © 2026 EVOLIX. All rights reserved.
                  </p>
                </div>

              </div>
            </footer>

          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
